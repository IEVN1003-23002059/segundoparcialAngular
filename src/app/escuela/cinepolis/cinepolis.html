<div class="max-w-3xl mx-auto p-6 bg-white rounded-lg shadow border border-gray-200 mt-6">

  <h1 class="text-3xl font-extrabold text-center text-blue-900 mb-6 uppercase tracking-wide">
    Cinépolis - La Capital del Cine
  </h1>

  <form [formGroup]="formulario" (ngSubmit)="procesar()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Sección de Entradas -->
      <div class="p-4 border border-gray-200 rounded-lg bg-gray-50">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Entradas</h2>

        <!-- Nombre -->
        <div class="mb-4">
          <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
          <input
            type="text"
            id="nombre"
            formControlName="nombre"
            class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            placeholder="Ingrese nombre"
            required
          >
        </div>

        <!-- Cantidad Compradores -->
        <div class="mb-4">
          <label for="compradores" class="block mb-2 text-sm font-medium text-gray-900">Cantidad Compradores</label>
          <input
            type="number"
            id="compradores"
            formControlName="compradores"
            min="1"
            class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            required
          >
        </div>

        <!-- Tarjeta Cineco -->
        <div class="mb-4">
          <label class="block mb-2 text-sm font-medium text-gray-900">Tarjeta Cineco</label>
          <div class="flex items-center space-x-6">
            <div class="flex items-center">
              <input
                id="cineco-si"
                type="radio"
                value="si"
                formControlName="tarjetaCineco"
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
              >
              <label for="cineco-si" class="ms-2 text-sm font-medium text-gray-900">Sí</label>
            </div>
            <div class="flex items-center">
              <input
                id="cineco-no"
                type="radio"
                value="no"
                formControlName="tarjetaCineco"
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
              >
              <label for="cineco-no" class="ms-2 text-sm font-medium text-gray-900">No</label>
            </div>
          </div>
        </div>

        <!-- Cantidad De Boletas -->
        <div class="mb-2">
          <label for="boletas" class="block mb-2 text-sm font-medium text-gray-900">Cantidad de Boletas</label>
          <input
            type="number"
            id="boletas"
            formControlName="boletas"
            min="1"
            class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            required
          >
        </div>
      </div>

      <!-- Sección de Salidas -->
      <div class="p-4 border border-gray-200 rounded-lg bg-gray-50 flex flex-col justify-between">
        <div>
          <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Salidas</h2>

          <div class="mb-4">
            <label class="block mb-1 text-sm font-medium text-gray-700">Cliente:</label>
            <p class="text-lg font-semibold text-gray-900">{{ nombreCliente || '-' }}</p>
          </div>

          <div>
            <label class="block mb-1 text-sm font-medium text-gray-700">Valor a Pagar:</label>
            <div class="p-3 bg-blue-50 border border-blue-200 text-blue-900 font-bold text-2xl rounded-lg text-center">
              ${{ totalPagar | number:'1.2-2' }}
            </div>
          </div>
        </div>

        <!-- Alerta de Error -->
        @if (mensajeError) {
          <div class="p-4 mt-4 text-sm text-red-800 rounded-lg bg-red-100 border border-red-200" role="alert">
            <span class="font-medium">Atención:</span> {{ mensajeError }}
          </div>
        }
      </div>

    </div>

    <!-- Botón Procesar -->
    <div class="mt-6 flex justify-center">
      <button
        type="submit"
        [disabled]="formulario.invalid"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-base px-8 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Procesar
      </button>
    </div>
  </form>

</div>
